<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Color Prediction Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🎨 Demo Color Prediction</h1>

    <div class="timer">
        Next Round In:
        <h2 id="countdown">10</h2>
    </div>

    <div class="score">
        Virtual Coins:
        <span id="coins">100</span>
    </div>

    <div class="buttons">
        <button class="green" onclick="predict('Green')">Green</button>
        <button class="violet" onclick="predict('Violet')">Violet</button>
        <button class="red" onclick="predict('Red')">Red</button>
    </div>

    <h3>Your Prediction</h3>
    <p id="prediction">None</p>

    <h3>Result</h3>
    <p id="result">Waiting...</p>

    <h3>History</h3>
    <ul id="history"></ul>
</div>

<script src="script.js"></script>

</body>
</html>
