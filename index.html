<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99Lottery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: white; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background: #1e293b; padding: 15px; min-height: 100vh; }
        .header { text-align: center; font-size: 24px; font-weight: bold; color: #38bdf8; margin-bottom: 15px; }
        .card { background: #334155; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .balance-title { font-size: 14px; color: #94a3b8; }
        .balance-amount { font-size: 28px; font-weight: bold; color: #4ade80; margin: 5px 0; }
        .auth-box { display: flex; flex-direction: column; gap: 10px; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #38bdf8; color: black; font-weight: bold; cursor: pointer; }
        .bet-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .btn-green { background: #22c55e; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-violet { background: #a855f7; color: white; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-deposit { background: #eab308; color: black; }
        .btn-withdraw { background: #ec4899; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">99LOTTERY</div>

    <!-- AUTH SECTION -->
    <div id="auth-section" class="card">
        <h3 id="auth-title" style="margin-bottom:10px;">Login</h3>
        <div class="auth-box">
            <input type="text" id="phone" placeholder="Mobile Number">
            <input type="password" id="password" placeholder="Password">
            <input type="text" id="otp" placeholder="Enter OTP (123456)" class="hidden">
            <button id="send-otp-btn" class="hidden" onclick="sendOTP()">Get OTP</button>
            <button id="submit-btn" onclick="handleAuth()">Login</button>
            <p style="font-size: 12px; text-align: center; color: #94a3b8; cursor: pointer;" onclick="toggleAuth()">
                <span id="toggle-text">Account nahi hai? Register karein</span>
            </p>
        </div>
    </div>

    <!-- MAIN GAME SECTION (AFTER LOGIN) -->
    <div id="game-section" class="card hidden">
        <div class="balance-title">Available Balance</div>
        <div class="balance-amount" id="user-balance">₹0.00</div>
        <div style="font-size: 12px; color: #94a3b8;">UID: <span id="user-uid">--</span></div>

        <div class="action-btns">
            <button class="btn-deposit" onclick="showDeposit()">Deposit</button>
            <button class="btn-withdraw" onclick="showWithdraw()">Withdraw</button>
        </div>

        <hr style="margin: 15px 0; border-color: #475569;">

        <h3>WinGo 1Min Game</h3>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">Select Color to Place Bet:</p>

        <input type="number" id="bet-amount" placeholder="Bet Amount (Min ₹1)" value="10">

        <div class="bet-buttons">
            <button class="btn-green" onclick="placeBet('Green')">Green</button>
            <button class="btn-violet" onclick="placeBet('Violet')">Violet</button>
            <button class="btn-red" onclick="placeBet('Red')">Red</button>
        </div>
    </div>
</div>

<script>
    let isRegistering = false;
    let currentUser = null;

    function toggleAuth() {
        isRegistering = !isRegistering;
        document.getElementById('auth-title').innerText = isRegistering ? "Register" : "Login";
        document.getElementById('toggle-text').innerText = isRegistering ? "Already registered? Login" : "Account nahi hai? Register karein";
        document.getElementById('submit-btn').innerText = isRegistering ? "Register" : "Login";
        
        if (isRegistering) {
            document.getElementById('otp').classList.remove('hidden');
            document.getElementById('send-otp-btn').classList.remove('hidden');
        } else {
            document.getElementById('otp').classList.add('hidden');
            document.getElementById('send-otp-btn').classList.add('hidden');
        }
    }

    async function sendOTP() {
        const phone = document.getElementById('phone').value;
        const res = await fetch('/api/send-otp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone })
        });
        const data = await res.json();
        alert(data.message || "OTP is: " + data.otp);
    }

    async function handleAuth() {
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;
        const otp = document.getElementById('otp').value;

        const endpoint = isRegistering ? '/api/register' : '/api/login';
        const body = isRegistering ? { phone, password, otp } : { phone, password };

        const res = await fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const data = await res.json();

        if (data.success) {
            currentUser = data.user;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('user-balance').innerText = `₹${currentUser.balance.toFixed(2)}`;
            document.getElementById('user-uid').innerText = currentUser.uid;
        } else {
            alert(data.message);
        }
    }

    async function placeBet(selection) {
        const amount = document.getElementById('bet-amount').value;
        if (!currentUser) return alert("Pehle Login karein!");

        const res = await fetch('/api/place-bet', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone: currentUser.phone, amount, selection })
        });
        const data = await res.json();

        if (data.success) {
            currentUser.balance = data.newBalance;
            document.getElementById('user-balance').innerText = `₹${currentUser.balance.toFixed(2)}`;
            alert(data.message);
        } else {
            alert(data.message);
        }
    }

    async function showDeposit() {
        const amount = prompt("Enter Deposit Amount (Min ₹100):");
        if (!amount) return;
        const utr = prompt("Send money to UPI: ravikumar9332@ybl & enter 12-Digit UTR/Ref No:");
        if (!utr) return;

        const res = await fetch('/api/submit-deposit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone: currentUser.phone, amount, utr })
        });
        const data = await res.json();
        alert(data.message);
    }

    async function showWithdraw() {
        if (!currentUser.bankDetails) {
            const upiId = prompt("Enter your UPI ID for Withdrawal:");
            if (!upiId) return;
            await fetch('/api/save-bank', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: currentUser.phone, upiId })
            });
            currentUser.bankDetails = { upiId };
        }

        const amount = prompt("Enter Withdrawal Amount (Min ₹110):");
        if (!amount) return;

        const res = await fetch('/api/request-withdraw', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone: currentUser.phone, amount })
        });
        const data = await res.json();
        if (data.success) {
            currentUser.balance = data.newBalance;
            document.getElementById('user-balance').innerText = `₹${currentUser.balance.toFixed(2)}`;
        }
        alert(data.message);
    }
</script>
</body>
</html>
