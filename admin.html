<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Admin Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111827;
color:white;
display:flex;
}

.sidebar{
width:240px;
height:100vh;
background:#1f2937;
padding:20px;
}

.sidebar h2{
margin-bottom:25px;
}

.sidebar a{
display:block;
padding:12px;
margin-bottom:10px;
text-decoration:none;
color:white;
background:#374151;
border-radius:8px;
}

.sidebar a:hover{
background:#2563eb;
}

.main{
flex:1;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:25px;
}

.card{
background:#1f2937;
padding:20px;
border-radius:12px;
text-align:center;
}

.card h3{
font-size:28px;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
background:#1f2937;
}

th,td{
padding:14px;
text-align:left;
border-bottom:1px solid #374151;
}

th{
background:#374151;
}

.status{
padding:5px 12px;
border-radius:6px;
background:#16a34a;
}

.log{
margin-top:25px;
background:#1f2937;
padding:20px;
border-radius:12px;
}

button{
padding:10px 18px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

@media(max-width:700px){
body{
flex-direction:column;
}
.sidebar{
width:100%;
height:auto;
}
}
</style>
</head>

<body>

<div class="sidebar">
<h2>ADMIN</h2>

<a href="#">Dashboard</a>
<a href="#">Users</a>
<a href="#">Reports</a>
<a href="#">Activity</a>
<a href="#">Settings</a>

</div>

<div class="main">

<div class="header">
<h1>Dashboard</h1>
<button onclick="refreshData()">Refresh</button>
</div>

<div class="cards">

<div class="card">
<p>Total Users</p>
<h3 id="users">1245</h3>
</div>

<div class="card">
<p>Online Users</p>
<h3 id="online">186</h3>
</div>

<div class="card">
<p>Reports</p>
<h3 id="reports">12</h3>
</div>

<div class="card">
<p>System Status</p>
<h3>Running</h3>
</div>

</div>

<h2>User List</h2>

<table>

<tr>
<th>Name</th>
<th>ID</th>
<th>Status</th>
</tr>

<tr>
<td>Rahul</td>
<td>#1001</td>
<td><span class="status">Active</span></td>
</tr>

<tr>
<td>Aman</td>
<td>#1002</td>
<td><span class="status">Active</span></td>
</tr>

<tr>
<td>Riya</td>
<td>#1003</td>
<td><span class="status">Active</span></td>
</tr>

</table>

<div class="log">

<h2>Activity Log</h2>

<p id="activity">
System Started Successfully.
</p>

</div>

</div>

<script>

function refreshData(){

document.getElementById("users").innerHTML=
1200+Math.floor(Math.random()*100);

document.getElementById("online").innerHTML=
150+Math.floor(Math.random()*100);

document.getElementById("reports").innerHTML=
Math.floor(Math.random()*20);

document.getElementById("activity").innerHTML=
"Dashboard refreshed at "+
new Date().toLocaleTimeString();

}

</script>

</body>
</html>
